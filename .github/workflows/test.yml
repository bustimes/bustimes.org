name: Run tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: 'npm'

    - run: npm install-ci-test
    - run: npm run lint
    - run: npm run build

  test-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: ghcr.io/bustimes/bustimes.org/bustimes-base:3.14

    permissions:
      packages: read  # to use the bustimes-base docker image

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine

        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--no-sync"
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 3s
          --health-retries 5
          --health-start-period 5s
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        prune-cache: true
        cache-local-path: /__w/setup-uv-cache

    - run: uv sync --group test --frozen --no-install-package psycopg-c && mkdir staticfiles

    - name: run tests
      env:
        DATABASE_URL: postgis://postgres:postgres@postgres/postgres
        SECRET_KEY: secret
      run: uv run --no-sync coverage run --parallel-mode --concurrency=multiprocessing ./manage.py test --parallel=2 --keepdb --durations 10

    - name: generate coverage HTML report
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        uv run --no-sync coverage combine
        uv run --no-sync coverage html

    - name: upload coverage HTML artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-html
        path: htmlcov

  test-backend-python-3-15-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    continue-on-error: true
    container:
      image: python:3.15-rc-slim

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine

        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--no-sync"
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 3s
          --health-retries 5
          --health-start-period 5s
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install system dependencies
      run: |
        apt-get update && \
        apt-get install -y --no-install-recommends gdal-bin git gcc libc6-dev libpq-dev

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        prune-cache: true
        cache-local-path: /__w/setup-uv-cache

    - run: uv sync --group test --frozen --no-install-package psycopg-c --no-install-package onnxruntime --python 3.15 --python-preference only-system && mkdir staticfiles

    - name: run tests
      env:
        DATABASE_URL: postgis://postgres:postgres@postgres/postgres
        SECRET_KEY: secret
      run: uv run --no-sync --python 3.15 coverage run --parallel-mode --concurrency=multiprocessing ./manage.py test --parallel=2 --keepdb --durations 10

  publish-coverage:
    needs: test-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-html
        path: htmlcov

    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: htmlcov

    - id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
