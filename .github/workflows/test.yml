name: Run tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - run: npm install-ci-test
    - run: npm run lint
    - run: npm run build

  test-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/bustimes/bustimes.org/bustimes-base:3.14

    permissions:
      packages: read  # to use the bustimes-base docker image

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine

        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--no-sync"
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 3s
          --health-retries 5
          --health-start-period 5s
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        cache-local-path: /__w/setup-uv-cache

    - run: uv sync --group test --frozen --no-install-package psycopg-c && mkdir staticfiles

    - name: run tests
      env:
        DATABASE_URL: postgis://postgres:postgres@postgres/postgres
        SECRET_KEY: secret
      run: uv run --no-sync coverage run --parallel-mode --concurrency=multiprocessing ./manage.py test --parallel=2 --keepdb --durations 10

    - name: generate coverage HTML report
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        uv run --no-sync coverage combine
        uv run --no-sync coverage html

    - name: upload coverage HTML artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-html
        path: htmlcov

  publish-coverage:
    needs: test-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-html
        path: htmlcov

    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: htmlcov

    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
