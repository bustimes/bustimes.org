{% if operator.url %}
<div itemscope itemtype="http://schema.org/LocalBusiness">

    <h2 itemprop="name">{{ operator }}</h2>

    <dl class="contact-details">
        {% if operator.url %}
            <div>
                <dt>Website</dt>
                <dd itemprop="url">{{ urlise(operator.url) }}</dd>
            </div>
        {% endif %}

    </dl>

</div>
{% endif %}
